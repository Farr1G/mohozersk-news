<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="keywords" content="Мохозёрск, события, новости, INSERT_NAME">
        <meta name="description" content="Актуальная информация о происходящем в Мохозёрске">
        <meta name="author" content="INSERT_NAME">

        <title>INSERT_NAME | Лента новостей Мохозёрска</title>
        <link rel="shortcut icon" href="/data/images/favicon.png" type="image/x-icon">

        <link rel="preconnect" href="https://fonts  .googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:opsz,wdth,wght@8..144,50..150,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="/css/global.css">
        <link rel="stylesheet" href="/css/layout.css">
        <link rel="stylesheet" href="/css/cards.css">
        <link rel="stylesheet" href="/css/pages/search.css">
    </head>
    <body class="body-text">
        <div class="container">
            <main class="main">
                <h1 class="heading">Поиск по сайту</h1>
                
                <section class="search">
                    <form>
                        <search class="searchbar">
                            <input type="search" placeholder="Найти статью..." class="searchbar__input searchbar__input_large body-text">
                            <button type="submit" class="searchbar__button body-text"><img src="/data/images/icons/search.svg" alt="Лупа"></button>
                        </search>

                        <h2 class="subheading">Фильтры</h2>
                        <fieldset class="search__fieldset">
                            <input type="date" id="from-date-input" class="searchbar__input body-text">
                            <input type="date" id="until-date-input">

                            <select id="theme-input">
                                <option value="none">По всем темам</option>
                                <option value="none">Власть</option>
                                <option value="none">Потом добавить сюда темы</option>
                                <option value="none">По тегам</option>
                            </select>
                        </fieldset>

                        <h2 class="subheading">Теги</h2>
                        <fieldset class="search__fieldset">
                            <div class="article__tags">
                                <template id="article-tag-template">
                                    <button class="article__tag caption-text"></button>
                                </template>
                                <button href="#" class="article__tag caption-text">Власть</button>
                                <button href="#" id="add-tags-button" class="article__tag caption-text">Добавить тег</button>
                            </div>
                        </fieldset>
                    </form>
                </section>
                <section>
                    <a href="#" class="card card_s">
                        <h3 class="card__title title-m">Новость</h3>
                        <time datetime="" class="card__date caption">14 ноября</time>
                        <div class="article__tags">
                            <template id="article-tag-template">
                                <span class="article__tag caption-text"></span>
                            </template>
                        </div>
                    </a>
                </section>
            </main>

            <aside class="aside">
                <template id="article-card-s-template">
                    <a href="#" class="card card_s">
                        <h3 class="card__title title-m"></h3>
                        <time datetime="" class="card__date caption"></time>
                    </a>
                </template>

                <h2 class="aside__h2 heading">Свежие новости</h2>
            </aside>
        </div>
        
        <script src="/js/api.js"></script>
        <script src="/js/news-columns.js"></script>
        <script src="/js/aside-feed-only.js"></script>
        <script src="/js/pages/search.js"></script>
    </body>
</html>
