    <body class="body-text">
        <header class="header" id="header-placeholder"></header>
        
        <div class="container">
            <main class="main">
                <h1 class="heading">Поиск по сайту</h1>
                <form id="search-form">
                    <search class="searchbar">
                        <input type="search" id="searchbar-input" name="searchbar-input" placeholder="Найти статью..." class="searchbar__input input__field input__field_l body-text">

                    <fieldset class="search__fieldset">
                        <div class="input">

                        </div>
                        <div class="input">
                            <div class="input__name functional-text">Тема</div>
                            <select id="theme-input" name="theme-input" class="input__field input__field_m body-text">

                                <template id="option-template"><option></option></template>
                            </select>
                        </div>
                    </fieldset>
                </form>
                <section class="search-results"></section>
            </main>

            <aside class="aside">
                <template id="article-card-s-template">
                    <a href="#" class="card card_s">
                        <h3 class="card__title title-m"></h3>
                        <time datetime="" class="card__date caption"></time>

                </template>

                <h2 class="aside__h2 heading">Свежие новости</h2>
            </aside>
        </div>

        <footer class="footer" id="footer-placeholder"></footer>
        
        <script src="/js/api.js"></script>
